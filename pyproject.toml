[project]
name = "experiment-at-home"
version = "0.0.0" # inert sentinel; the real version is set from the release tag
description = "The plumbing every local AI experiment rebuilds, built once."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Yasyf Mohamedali", email = "yasyfm@gmail.com" }]
keywords = ["mlx", "ocr", "caching", "batch", "llm", "launchd", "autoresearch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21",
    "anyio>=4",
    "click>=8",
    "httpx>=0.28",
    "loguru>=0.7",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
serve = ["httpx>=0.28", "openai>=1.50"]
activator = ["starlette>=0.40", "uvicorn>=0.30"]
# transcribe.cpp is pre-1.0: its ABI may break between 0.x minors, so the ctypes
# binding and its bundled native library are exact-pinned and bumped in lockstep.
stt = [
    "transcribe-cpp==0.1.3",
    "transcribe-cpp-native==0.1.3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.26",
    "static-ffmpeg>=2.7",
]
llm = ["spawnllm>=0.6.1"]
ocr = ["ocrmac>=1.0"]
modal = ["modal>=1.0"]
hf = ["huggingface-hub>=0.26"]
embed = ["numpy>=2", "sentence-transformers>=3"]
embed-voyage = ["voyageai>=0.3.7", "numpy>=2"]
research = ["numpy>=2"]
gate = ["numpy>=2", "scipy>=1.14.1", "scikit-learn>=1.5"]
# mlx / mlx-lm run in a uvx sidecar, and trl / peft only exist inside the Modal
# image — none of those belong in the installed set. transformers does: the tinker
# path tokenizes prompt/completion (and chosen/rejected) locally through
# AutoTokenizer.apply_chat_template before handing tinker token IDs, and that call
# needs jinja2 — which transformers pulls only under its `chat-template` extra, so
# a bare install would ImportError on the first Tinker run.
train = ["tinker>=0.22", "datasets>=4", "modal>=1.0", "transformers>=4.42", "jinja2>=3.1"]
# Tinker DPO only. Its custom loss runs locally: `forward_backward_custom` returns
# logprobs, and torch computes the log-sigmoid margin and backprops it into the
# per-token weights. Modal DPO needs nothing here (torch lives in the Modal image),
# and SFT needs nothing here at all — so torch stays out of `train` rather than
# putting a multi-hundred-MB wheel in front of every user who only wants SFT.
train-dpo = ["torch>=2.6"]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "numpy>=2",
    "scipy>=1.14.1",
    "scikit-learn>=1.5",
]

[project.scripts]
athome = "athome.cli:main"

[project.urls]
Homepage = "https://github.com/yasyf/experiment-at-home"
Documentation = "https://yasyf.github.io/experiment-at-home/"
Repository = "https://github.com/yasyf/experiment-at-home"
Issues = "https://github.com/yasyf/experiment-at-home/issues"
Changelog = "https://github.com/yasyf/experiment-at-home/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "athome"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--tb=short", "-q"]
markers = [
    "unit: Pure unit tests",
    "integration: Integration tests",
    "live: Tests requiring real MLX/models/API/Modal (skipped in the mocked run)",
]

# ty (Astral) is the default type checker. It runs on every commit via the prek
# hook (astral-sh/ty-pre-commit — the hook rev pins the ty version) and in CI,
# warnings only, never blocking. Ad hoc: `uvx prek run ty --all-files`.
# It is fast, understands modern syntax, and avoids the strict-pyright false
# positives on pydantic/attrs-style dynamic defaults and PK-type overrides.
[tool.ty.rules]
# Every diagnostic surfaces as a warning: ty exits 0 and never blocks a commit or CI.
all = "warn"
# Keep cross-checker `# type: ignore` / `# pyright: ignore` comments from tripping ty.
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"

# pyright is kept as a secondary checker (editors / `uvx pyright`). Basic mode plus
# a few disables covers the noise; ty is the default checker, surfaced as warnings
# at commit time and in CI.
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["athome"]
venvPath = "."
venv = ".venv"
reportImplicitOverride = "none"
reportIncompatibleVariableOverride = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportPrivateImportUsage = "none"
reportUnusedCallResult = "none"

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports the public API via plain imports (`from .foo import
# Bar`; no `as` alias, no __all__). F401 stays active in every other module.
"__init__.py" = ["F401"]

[dependency-groups]
docs = [
    # great-docs imports griffe's 2.x module layout; griffelib is the modern
    # griffe (2.x) distribution, overriding the legacy griffe<2 pin great-docs
    # itself still declares.
    "griffelib>=2.0",
    "great-docs>=0.15,<0.16",
]
