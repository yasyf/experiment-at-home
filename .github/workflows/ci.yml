name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Sync (dev + llm + train-dpo)
        # The `llm` extra brings spawnllm so the research-judge suite runs with real
        # coverage. `train-dpo` brings torch, without which tinker's DPO loss — the whole
        # custom-loss path — silently skips and ships unverified. Other extras (ocr's
        # ocrmac is macOS-only; modal/hf/serve are mocked) stay out — their tests skip or
        # mock. The free-threaded job below stays dev-only on purpose: its job is to prove
        # the CORE imports with the GIL off, not to re-run the trainers.
        run: uv sync --extra dev --extra llm --extra train-dpo

      - name: Type check (ty, warnings only)
        continue-on-error: true
        run: uvx prek run ty --all-files

      - name: Test (pytest)
        run: uv run pytest

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/athome --help

  # stream-trade runs Python 3.14 free-threaded: athome core must import with the
  # GIL still disabled (a non-free-threaded extension wheel silently re-enables it).
  # This job is the empirical verdict on every core dep's free-threaded support.
  freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          cache-dependency-glob: uv.lock

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Import every core module with the GIL still disabled
        run: |
          uv run python -c "
          import sys
          import athome
          import athome.cache, athome.cli, athome.config, athome.detach, athome.errors
          import athome.launchd, athome.llmcache, athome.ocr, athome.progress
          import athome.store, athome.sync, athome.wire, athome.workers
          assert not sys._is_gil_enabled(), 'an import re-enabled the GIL'
          print('GIL still disabled after importing athome core')
          "

      - name: Test (pytest)
        run: uv run pytest
