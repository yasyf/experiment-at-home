name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Sync (dev + llm + train-dpo + stt + modal)
        # llm: spawnllm judges. train-dpo: torch (DPO loss else skips). stt: transcribe-cpp for
        # the FakeModel suite. modal: real-SDK FILE-registration proof. Others stay out —
        # macOS-only or mocked.
        run: uv sync --extra dev --extra llm --extra train-dpo --extra stt --extra modal

      - name: Type check (ty, warnings only)
        continue-on-error: true
        run: uvx prek run ty --all-files

      - name: Test (pytest)
        run: uv run pytest

      - name: STT integration (real moonshine-tiny weights, CPU)
        # ~34MB Q8 GGUF at the pinned revision decoding the committed fixture; Metal smokes stay dev-only.
        run: uv run pytest tests/test_stt.py --run-live -k test_live_moonshine_tiny_batch_transcribes_the_fixture
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build + smoke-test wheel in a fresh venv
        run: |
          uv build
          rm -rf .wheel-smoke
          uv venv --seed .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/athome --help

  # stream-trade runs Python 3.14 free-threaded: athome core must import with the
  # GIL still disabled (a non-free-threaded extension wheel silently re-enables it).
  # This job is the empirical verdict on every core dep's free-threaded support.
  freethreaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.14t"
          cache-dependency-glob: uv.lock

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Import every core module with the GIL still disabled
        run: |
          uv run python -c "
          import sys
          import athome
          import athome.cache, athome.cli, athome.config, athome.detach, athome.errors
          import athome.launchd, athome.llmcache, athome.ocr, athome.progress
          import athome.store, athome.stt, athome.sync, athome.wire, athome.workers
          assert not sys._is_gil_enabled(), 'an import re-enabled the GIL'
          print('GIL still disabled after importing athome core')
          "

      - name: Test (pytest)
        run: uv run pytest
