# Great Docs configuration — https://posit-dev.github.io/great-docs/
# Build: uv run great-docs build · Preview: uv run great-docs preview

module: athome
display_name: experiment-at-home
parser: google
dynamic: true
repo: https://github.com/yasyf/experiment-at-home
site_url: "https://yasyf.github.io/experiment-at-home/"
pypi: true
github_style: widget
jupyter: python3

# Rewrite generated reference titles to pre-parsed pandoc-native Spans so Quarto
# doesn't re-parse the bracketed-span sidebar markup on every page — Pandoc
# backtracks exponentially on __dunder__ emphasis candidates (jgm/pandoc#11687),
# which can push a large API reference's build past an hour. No-op until you add
# a reference: section below. See docs/scripts/native_reference_titles.py.
pre_render:
  - docs/scripts/native_reference_titles.py

# Conservative defaults: a solid navbar and a single accent, no gradient
# presets or hero starfield. The gradient/starfield extras read as busy and the
# starfield canvas intercepts homepage clicks; keep them off unless asked.
# Palette from the mascot: near-black banner background, roof-orange accent.
navbar_color: "#171a21"
accent_color: "#e85d2c"
dark_mode_toggle: true
back_to_top: true
keyboard_nav: true

# Navbar logo + favicon are auto-detected from docs/assets/logo.png (the
# generated mascot); no logo key is needed here.
hero:
  name: experiment-at-home
  # Keep the tagline equal to the README opener fragment (one fragment, five surfaces).
  tagline: "The plumbing every local AI experiment rebuilds, built once."

# Narrative doc sections are optional — dynamic mode generates the API reference
# from docstrings without them. Uncomment and point at docs/ dirs as they appear.
# sections:
#   - title: Getting Started
#     dir: docs/getting-started
#     index: true
#   - title: Guide
#     dir: docs/guide
#     navbar_after: Getting Started
#     index: true

cli:
  enabled: true
  module: athome.cli
  name: cli

authors:
  - name: Yasyf Mohamedali
    role: Maintainer
    github: yasyf
    email: yasyfm@gmail.com

# Curated symbol reference (public API only). Type aliases (launchd.Schedule,
# wire.Wire) stay out — great-docs cannot document Kind.TYPE_ALIAS.
reference:
  - title: Config
    desc: The pydantic-settings surface over ~/.athome/config.toml.
    contents:
      - config.SectionSettings
      - config.AthomeSettings
      - config.load
  - title: Cache
    desc: Content+version-keyed caching with atomic staging writes.
    contents:
      - cache.Cache
      - cache.CacheKey
      - cache.CacheStats
      - cache.cached
      - cache.stats_all
      - cache.CacheKeyError
  - title: LLM cache
    desc: Record/replay HTTP caching for OpenAI-shaped clients.
    contents:
      - llmcache.LlmCacheMode
      - llmcache.LlmCacheSettings
      - llmcache.CachingTransport
      - llmcache.RetryTransport
      - llmcache.transport
      - llmcache.LlmCacheMiss
  - title: Workers
    desc: Sidecar subprocesses speaking the length-prefixed wire protocol.
    contents:
      - workers.WorkerTransport
      - workers.WorkerSpec
      - workers.PipeWorker
      - workers.WorkerPool
      - workers.serve
      - workers.WorkerError
      - workers.WorkerCrashed
      - workers.HandshakeMismatch
      - wire.validate
      - wire.encode
      - wire.decode
      - wire.WireError
  - title: Progress
    desc: Resumable work-sets, crash-safe run sinks, phase gating.
    contents:
      - progress.WorkSet
      - progress.RunSink
      - progress.Phases
      - progress.FailureBudgetExceeded
      - progress.PhaseMissing
  - title: launchd
    desc: Declarative launchd agents.
    contents:
      - launchd.AgentSpec
      - launchd.Calendar
      - launchd.Interval
      - launchd.KeepAlive
      - launchd.AgentStatus
      - launchd.plist_dict
      - launchd.install
      - launchd.uninstall
      - launchd.status
      - launchd.installed
      - launchd.LaunchdError
  - title: Detach
    desc: Sentinel-tracked detached overnight runs.
    contents:
      - detach.DetachedRun
      - detach.launch
      - detach.wait
      - detach.running
      - detach.DetachError
  - title: Sync
    desc: Verified rsync mirroring.
    contents:
      - sync.mirror
      - sync.SyncReport
      - sync.SyncVerificationError
  - title: Store
    desc: The shared aiosqlite scaffold.
    contents:
      - store.Store
  - title: OCR types
    desc: Protocols for token- and document-level OCR engines.
    contents:
      - ocr.Box
      - ocr.OcrToken
      - ocr.Document
      - ocr.TokenOcr
      - ocr.DocOcr
  - title: Errors
    desc: The exception root the CLI renders.
    contents:
      - errors.AthomeError
